plugins {
    id 'fabric-loom' version '1.10-SNAPSHOT'
    id 'maven-publish'
}

base {
    archivesName = rootProject.archives_base_name
}

loom {
    runs {
        server {
            runDir '../run'
        }
    }
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    implementation project(':finder-core')
    implementation project(':trial-spawner-finder')
    implementation project(':geode-finder')
    include project(':finder-core')
    include project(':trial-spawner-finder')
    include project(':geode-finder')

    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    mappings "net.fabricmc:yarn:${rootProject.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': inputs.properties.version
    }
}

java {
    withSourcesJar()
}

test {
    maxParallelForks = 1
}
