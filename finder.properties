finder-type=geode

# Minecraft Java 版 1.21.1 世界种子
seed=9206294873968313284

# 搜索中心（方块坐标）以及从中心向外扫描的半径
search-center-x=0
search-center-z=0
search-radius-blocks=100000
search-area-shape=circle
# true：忽略搜索中心和半径，扫描完整的 6000万 x 6000万 世界正方形
full-world=false

# 聚类统计半径；circle 表示水平圆形，square 表示中心向 X/Z 各扩展指定距离
cluster-radius-blocks=128
area-shape=circle
# 圆形或方形范围内至少包含的试炼密室数量
min-structures=1
# 范围内至少包含的试炼刷怪笼数量
min-spawners=20

# 快速扫描线程数，以及每个扫描分片的边长（方块）
scan-threads=8
scan-shard-size-blocks=262144

# 紫水晶查找器使用同一搜索区域；当前纯算法支持 Minecraft 1.19+
minecraft-version=1.21.1
# auto：1.21.4及以前使用区块中心128方块规则，1.21.5+使用模拟距离
geode-activity-rule=auto
geode-legacy-random-tick-radius-blocks=128
geode-simulation-distance-chunks=10
geode-min-geodes=20
geode-min-budding-amethyst=1
# 全区域粗筛后保留的晶洞高密度窗口；数值越大越不容易漏掉母岩异常高的候选
geode-prefilter-limit=5000
# 开发环境中真实生成并验证的理论候选数量
geode-verification-limit=100
# 最终结果文件保留的真实排名数量
geode-result-limit=20
