# 必填：试炼密室生成规则版本
# 1 = Minecraft Java 1.21-1.21.1 的初代试炼密室布局
#     实际使用 Minecraft 1.21.1 生成引擎
# 2 = Minecraft Java 1.21.2-26.2 的现代试炼密室布局
#     实际使用 Minecraft 26.2 生成引擎（当前验证至 26.2）
generation-version=

# 可选：自定义运行 JDK 根目录；留空时自动使用或安装 GraalVM 25
java-home=

# 临时服务端端口；默认避开常用的 25565
server-port=25566

# 必填：Minecraft Java 版世界种子，范围为 Java long
seed=

# 搜索中心与圆形搜索半径（方块）
search-center-x=0
search-center-z=0
search-radius-blocks=100000
search-area-shape=circle
# true：忽略中心和半径，扫描完整世界正方形
full-world=false

# 结果统计范围：circle 为圆形，square 为中心向 X/Z 各扩展指定距离
trial-cluster-radius-blocks=128
trial-area-shape=circle
trial-min-structures=2
trial-min-spawners=20
trial-search-mode=auto
# 发行版使用已验证的快速预测；大于 0 时会在启动阶段额外执行开发校准
trial-prediction-calibration-structures=0

# 快速扫描线程数；线程数建议不超过 CPU 逻辑线程数
scan-threads=4
