# ==================== 1. 本次运行 ====================
# trial-spawner：查找试炼刷怪笼；geode：查找紫水晶母岩
finder-type=trial-spawner
# Minecraft Java 版世界种子
seed=0
# 当前运行时固定为 1.21.1；紫水晶算法会据此选择母岩活动范围规则
minecraft-version=1.21.1

# ==================== 2. 公共搜索范围 ====================
# 坐标和半径均为方块；形状可选 circle 或 square
search-center-x=0
search-center-z=0
search-radius-blocks=1000000
search-area-shape=circle
# true：忽略以上中心、半径和形状，扫描完整世界
full-world=false

# ==================== 3. 公共扫描性能 ====================
# 试炼密室会根据搜索半径和线程数自动分片；4 GB 内存建议线程数不超过 8
scan-threads=8

# ==================== 4. 试炼刷怪笼专用 ====================
# 统计范围的半径和形状；形状可选 circle 或 square
trial-cluster-radius-blocks=128
trial-area-shape=circle
# 结果至少包含的试炼密室数和刷怪笼数
trial-min-structures=2
trial-min-spawners=20
# auto：启用经过原版校验的精确预筛；exact：使用有界流水线逐个原版验证
trial-search-mode=auto
# 开发校准：启动时用原版逐坐标核对的密室数量；0 表示关闭启动校准
trial-prediction-calibration-structures=512

# ==================== 5. 紫水晶母岩专用 ====================
# 1.21.4及以前使用随机刻半径；1.21.5及以后使用模拟距离
geode-legacy-random-tick-radius-blocks=128
geode-simulation-distance-chunks=10
# 结果至少包含的晶洞数和活跃紫水晶母岩数
geode-min-geodes=20
geode-min-budding-amethyst=1
# 粗筛保留数越大越不容易漏掉高母岩候选，但精排耗时和内存也会增加
geode-prefilter-limit=5000
# 真实世界验证数量，以及最终写入结果文件的数量
geode-verification-limit=100
geode-result-limit=20
